    "pipecat-ai[runner,sarvam,silero,webrtc,websocket]>=1.15.0",
    "python-dotenv>=1.2.4",
    "sqlmodel>=0.0.48",
    "twilio>=9.12.0",
    "uvicorn[standard]>=0.54.0",
]
