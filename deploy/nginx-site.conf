# Nginx site for Voice Agent Studio (VoicePilot) at voicepilot.n3xglobalsolutions.com.
# The app container listens on 127.0.0.1:7860; Nginx gives it the public domain.
#
#   cp deploy/nginx-site.conf /etc/nginx/sites-available/voicepilot
#   ln -s /etc/nginx/sites-available/voicepilot /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d voicepilot.n3xglobalsolutions.com   (adds HTTPS + auto-renewal)
#
# Using another domain? Change server_name below.

server {
    listen 80;
    listen [::]:80;
    server_name voicepilot.n3xglobalsolutions.com;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:7860;
        proxy_http_version 1.1;

        # WebSockets (phone calls stream audio over them)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Calls can last several minutes: don't cut long-lived connections.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
